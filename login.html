<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zovari - Sign In</title>
  <link rel="icon" href="zovari-logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-shell">

    <!-- Left visual panel -->
    <div class="auth-visual">
      <div class="auth-visual-brand">
        <img src="zovari-logo.png" alt="Zovari logo" />
        <span>Zovari</span>
      </div>
      <div class="auth-visual-copy">
        <h2>Elevate Your Circle.</h2>
        <p>Join the definitive premium social network designed for meaningful connections, high-quality content, and exclusive experiences.</p>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="auth-form-side">
      <form class="auth-form" id="login-form" onsubmit="handleLoginSubmit(event)">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your account.</p>

        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined">mail</span>
            <input type="email" id="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <div class="form-row-between">
            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="password" placeholder="••••••••" data-password-input required />
            <button type="button" data-password-toggle aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility_off</span>
            </button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" />
          Remember me for 30 days
        </label>

        <p class="form-error" id="login-error"></p>

        <button type="submit" class="btn btn-primary btn-block">
          Sign In <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <div class="divider">Or continue with</div>

        <div class="oauth-row">
          <button type="button" class="btn btn-outline">Google</button>
          <button type="button" class="btn btn-outline">Apple</button>
        </div>

        <p class="auth-footer-text">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
