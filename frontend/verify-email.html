<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zovari - Verify Email</title>
  <link rel="icon" href="zovari-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-shell">

    <!-- Left visual panel -->
    <div class="auth-visual">
      <div class="auth-visual-brand">
        <img src="zovari-logo.png" alt="Zovari logo" />
        <span>Zovari</span>
      </div>
      <div class="auth-visual-copy">
        <h2>Elevate Your Circle.</h2>
        <p>Join the definitive premium social network designed for meaningful connections, high-quality content, and exclusive experiences.</p>
      </div>
    </div>

    <!-- Right panel -->
    <div class="auth-form-side">
      <div class="auth-form" style="text-align:center;">
        <span class="material-symbols-outlined" data-verify-icon style="font-size:48px; color:var(--color-primary);">mark_email_read</span>
        <h2 data-verify-title>Verifying your email...</h2>
        <p data-verify-message>Please wait a moment.</p>

        <a href="login.html" class="btn btn-primary btn-block" style="margin-top:16px;">
          Go to sign in
        </a>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
