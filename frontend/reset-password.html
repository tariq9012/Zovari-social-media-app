<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zovari - Reset Password</title>
  <link rel="icon" href="zovari-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-shell">

    <!-- Left visual panel -->
    <div class="auth-visual">
      <div class="auth-visual-brand">
        <img src="zovari-logo.png" alt="Zovari logo" />
        <span>Zovari</span>
      </div>
      <div class="auth-visual-copy">
        <h2>Elevate Your Circle.</h2>
        <p>Join the definitive premium social network designed for meaningful connections, high-quality content, and exclusive experiences.</p>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="auth-form-side">
      <form class="auth-form" id="reset-form" onsubmit="handleResetPasswordSubmit(event)">
        <h2>Set a new password</h2>
        <p>Choose a new password for your account.</p>

        <div class="form-group">
          <label for="password">New password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="password" placeholder="At least 6 characters" data-password-input required />
            <button type="button" data-password-toggle aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility_off</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm new password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="confirm-password" placeholder="Re-enter password" required />
          </div>
        </div>

        <p class="form-error" id="reset-error"></p>

        <button type="submit" class="btn btn-primary btn-block">
          Reset password <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <p class="auth-footer-text">
          <a href="login.html">Back to sign in</a>
        </p>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
