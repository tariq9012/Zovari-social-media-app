<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zovari - Forgot Password</title>
  <link rel="icon" href="zovari-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-shell">

    <!-- Left visual panel -->
    <div class="auth-visual">
      <div class="auth-visual-brand">
        <img src="zovari-logo.png" alt="Zovari logo" />
        <span>Zovari</span>
      </div>
      <div class="auth-visual-copy">
        <h2>Elevate Your Circle.</h2>
        <p>Join the definitive premium social network designed for meaningful connections, high-quality content, and exclusive experiences.</p>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="auth-form-side">
      <form class="auth-form" id="forgot-form" onsubmit="handleForgotPasswordSubmit(event)">
        <h2>Forgot password?</h2>
        <p>Enter your email and we'll send you a link to reset your password.</p>

        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined">mail</span>
            <input type="email" id="email" placeholder="name@example.com" required />
          </div>
        </div>

        <p class="form-error" id="forgot-error"></p>
        <p class="form-success" id="forgot-success" style="display:none; color:#16a34a; font-size:13px; margin-top:-8px; margin-bottom:16px;"></p>

        <button type="submit" class="btn btn-primary btn-block">
          Send reset link <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <p class="auth-footer-text">
          Remembered your password? <a href="login.html">Sign in</a>
        </p>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
